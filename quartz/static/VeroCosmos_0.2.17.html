<script>
(async()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),msg=$('msg');
// Menú de páginas: Principal y Atlas.
const menuToggle=$('menu-toggle'),pageMenu=$('page-menu'),atlasPageLink=$('atlas-page-link'),principalPageLink=$('principal-page-link');
const featuredAtlasLink=$('featured-atlas-link');
atlasPageLink.href='#atlas';
menuToggle.addEventListener('click',()=>{
  const open=pageMenu.classList.toggle('open');
  menuToggle.setAttribute('aria-expanded',String(open));
  menuToggle.setAttribute('aria-label',open?'Cerrar menú de páginas':'Abrir menú de páginas');
});
document.addEventListener('pointerdown',ev=>{
  if(!$('menu-wrap').contains(ev.target)){
    pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Abrir menú de páginas');
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Abrir menú de páginas');
  }
});
function closePageMenu(){pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Abrir menú de páginas')}
function setPageActive(page){
  const isPrincipal=page==='principal';
  document.body.classList.toggle('principal-page',isPrincipal);
  if(isPrincipal){closePanel();$('principal-page-link').setAttribute('aria-current','page');atlasPageLink.removeAttribute('aria-current')}
  else{$('principal-page-link').removeAttribute('aria-current');atlasPageLink.setAttribute('aria-current','page');closePanel();setView(null)}
  closePageMenu();
}
principalPageLink.addEventListener('click',ev=>{ev.preventDefault();setPageActive('principal')});
atlasPageLink.addEventListener('click',ev=>{ev.preventDefault();setPageActive('atlas')});
featuredAtlasLink.addEventListener('click',ev=>{ev.preventDefault();setPageActive('atlas');setView(home)});
let W=1,H=1,sc=1;
// Orientación y zoom 3D compartidos por todas las vistas del atlas.
// Cada recarga empieza con una orientación y una media esfera irregular nuevas.
// skyCenter se recalcula a partir del centroide geométrico de todos los nodos visibles.
let skyCenter={x:0,y:0,z:0};
let skyYaw=Math.random()*Math.PI*2,skyPitch=(Math.random()-.5)*Math.PI*.8,skyZoom=.82+Math.random()*.36;
const homeOrientation={yaw:skyYaw,pitch:skyPitch,zoom:skyZoom};
// Las vistas de grupo conservan su distribución 2D original al abrirse; la rotación y el zoom son opcionales.
let groupYaw=0,groupPitch=0,groupZoom=1,dragging=false,dragMoved=false,lastPointer=null;
let resetAnimation=null;
const stars=Array.from({length:200},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,a:Math.random()*.6+.2}));
new ResizeObserver(()=>{const d=devicePixelRatio||1,r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);try{window.__sync=true;draw()}catch(e){}finally{window.__sync=false}}).observe(cv);

// ---- Datos: salen de contentIndex.json, que Quartz genera solo
let idx={};
try{idx=await(await fetch('contentIndex.json')).json()}catch(e){msg.textContent='No se pudo cargar contentIndex.json. Abre esta página desde la web, no como archivo suelto.';return}
const N={},E=[],seen=new Set();
for(const s in idx)N[s]={s,t:idx[s].title||s,adj:new Set(),obj:/\/descripciones\//.test(s)};
for(const s in idx)for(let t of idx[s].links||[]){
  t=String(t).replace(/^\//,'');
  if(!N[t])t=N[t+'/index']?t+'/index':null;
  if(!t||t===s)continue;
  const k=[s,t].sort().join('|');if(seen.has(k))continue;seen.add(k);
  E.push([N[s],N[t]]);N[s].adj.add(t);N[t].adj.add(s);
}
const all=Object.values(N).filter(n=>n.adj.size>0);   // las carpetas automáticas sin enlaces no se dibujan
all.forEach((n,i)=>{
  // Cada recarga genera una nube irregular nueva, con forma aproximada de media esfera.
  const a=Math.random()*Math.PI*2;
  const radius=55+Math.pow(Math.random(),.72)*390;
  n.x=Math.cos(a)*radius+(Math.random()-.5)*45;
  n.y=Math.sin(a)*radius+(Math.random()-.5)*45;
  n.vx=n.vy=0;
  // Media esfera irregular: x/y conservan la distribución del atlas y z ocupa
  // el volumen de un hemisferio, con variación aleatoria para evitar una cáscara perfecta.
  const hemiRadius=510;
  const radial2=n.x*n.x+n.y*n.y;
  const cap=Math.sqrt(Math.max(0,hemiRadius*hemiRadius-radial2));
  n.z=Math.random()*cap;
});
if(!all.length){msg.textContent='No hay notas con enlaces para dibujar.';return}
msg.textContent='Arrastra con el ratón para girar cualquier vista en 3D · Rueda para acercar o alejar · Clic en un grupo para explorarlo o en un objeto para abrir su ficha. Usa el botón de objetivo para recentrar.';

// ---- Vista (todo el atlas o un grupo local)
const home=all.find(n=>n.s==='index')||all.find(n=>/atlas/i.test(n.t))||null;
let baseView=all,view=all,vE=E,focus=null,alpha=1,hov=null;
let searchTerm='',matches=new Set(),onlyMatches=false;
const searchInput=$('search'),results=$('results');
// La búsqueda ignora mayúsculas y tildes: catálogo y catalogo coinciden.
function normalizeSearch(value){return value.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function matchAll(n,q){const h=normalizeSearch(n.t+' '+n.s),h2=h.replace(/[\s_\-]+/g,'');return q.split(/\s+/).every(w=>h.includes(w)||h2.includes(w.replace(/[\s_\-]+/g,'')))}
function refreshSearch(){
  const q=normalizeSearch(searchTerm.trim());
  matches=new Set(q?baseView.filter(n=>matchAll(n,q)).map(n=>n.s):[]);
  view=(q&&onlyMatches)?baseView.filter(n=>matches.has(n.s)):baseView;
  vE=E.filter(([a,b])=>view.includes(a)&&view.includes(b));
}
function renderResults(){
  const q=normalizeSearch(searchTerm.trim());
  results.replaceChildren();

function animateTo(tg,dur,done){
  if(anim)cancelAnimationFrame(anim);busy=true;
  const t0=performance.now(),f0={yaw:yaw,pitch:pitch,zoom:zoom,vx:vx,vy:vy};
  const dy=Math.atan2(Math.sin(tg.yaw-yaw),Math.cos(tg.yaw-yaw)),dp=Math.atan2(Math.sin(tg.pitch-pitch),Math.cos(tg.pitch-pitch));

    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    yaw=f0.yaw+dy*e;pitch=f0.pitch+dp*e;zoom=f0.zoom+(tg.zoom-f0.zoom)*e;vx=f0.vx+(tg.vx-f0.vx)*e;vy=f0.vy+(tg.vy-f0.vy)*e;
    render();

}
function openFicha(n,fromUrl,replace){
  if(fi)return;
  fi=document.createElement('iframe');fi.className='ficha-frame';fi.title=n.t;fiNode=n;
  fi.src='ficha.html?v=4#'+encodeURIComponent(n.s);
  fi.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:100001;background:#05060f;color-scheme:only light';
  document.body.append(fi);
  fi.addEventListener('load',()=>{try{fi.contentWindow.focus()}catch(e){}});
  if(T0===window)return;
  try{
    if(!fromUrl){const u=(cleanPath()||'/')+'#'+encodeURIComponent(fichaSeg(n.s));if(replace)T0.history.replaceState({vc:1},'',u);else{T0.history.pushState({vc:1},'',u);fichaPushed=true}}
    T0.document.title=n.t+' \u00b7 Vero Cosmos';
  }catch(e){}
}
function removeFicha(){if(fi){fi.remove();fi=null}}
function groupOf(n){
  const gs=all.filter(g=>!g.obj&&n.adj&&n.adj.has(g.s));
  return gs.find(g=>g.s.startsWith('catálogos/')&&!g.s.endsWith('/index'))||gs[0]||null;
}
function applyBack(n){
  if(!n)return;
  routeQuiet=true;
  try{
    if(curPage!=='guide'){
      if(curPage!=='atlas')setPageActive('atlas');
      const g=groupOf(n);if(g)setView(g);results.classList.remove('visible');
    }
    openPanel(n);
  }finally{routeQuiet=false}
}
function closeFicha(back,toGroup){
  const n=fiNode;
  if(!fi)return;
  removeFicha();
  if(T0===window)return;
  if(back&&fichaPushed){
    fichaPushed=false;
    if(toGroup){afterBack=()=>applyBack(n);setTimeout(()=>{if(afterBack){const f=afterBack;afterBack=null;f()}},700)}
    try{T0.history.back()}catch(e){}return;
  }
  fichaPushed=false;
  try{T0.history.replaceState({vc:1},'',cleanPath()||'/');T0.document.title=titleFor(curPage)}catch(e){}
  if(toGroup)applyBack(n);
}
window.addEventListener('message',e=>{
  if(!fi||e.source!==fi.contentWindow||!e.data)return;
  const m=e.data;
  if(m.vc==='close')closeFicha(true);
  else if(m.vc==='back')closeFicha(true,true);
  else if(m.vc==='open'){const n=all.find(x=>x.s===m.s);if(n&&FICHAS.has(n.s)){removeFicha();openFicha(n,false,true)}else{closeFicha(false);if(n)openPanel(n)}}
  else if(m.vc==='q'){
    const q=normalizeSearch(String(m.q||'').trim());
    const items=q?all.filter(n=>matchAll(n,q)).slice(0,30).map(n=>({t:n.t,s:n.s,obj:!!n.obj})):[];
    try{fi.contentWindow.postMessage({vc:'results',q:m.q,items},'*')}catch(x){}
  }
  else if(m.vc==='pick'){
    const n=all.find(x=>x.s===m.s);
    /* un objeto con ficha se abre directamente en su ficha completa */
    if(n&&n.obj&&FICHAS.has(n.s)){removeFicha();openFicha(n,false,true);return}
    closeFicha(false);
    if(n){if(n.obj)openPanel(n);else{setPageActive('atlas');setView(n)}}
  }
  else if(m.vc==='search'){
    /* Enter en el buscador: igual que en el atlas, deja solo las coincidencias */
    closeFicha(false);setPageActive('atlas');searchInput.value=m.q;searchInput.dispatchEvent(new Event('input',{bubbles:true}));
    searchInput.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
  }
  else if(m.vc==='go'){
    closeFicha(false);
    if(m.page==='about'){if(!qs){beforeAbout=curPage;openAbout(false);aboutPushed=topGo('about',true)}}
    else setPageActive(m.page);
  }
});
function routeFromLocation(){
  const p=cleanPath();
  const key=Object.keys(ROUTES).find(k=>ROUTES[k].path===p)||'principal';
  routeQuiet=true;
  try{
    if(key==='about'){if(!qs){beforeAbout=curPage;openAbout(false)}}
    else{removeAbout();setPageActive(key);try{T0.document.title=titleFor(key)}catch(e){}}
    const fn=key==='about'?null:fichaFromHash();
    if(fn){if(!fi)openFicha(fn,true)}else{removeFicha();fichaPushed=false}
  }finally{routeQuiet=false}
  if(afterBack){const f=afterBack;afterBack=null;f()}
}
if(T0!==window)T0.addEventListener('popstate',routeFromLocation);
window.addEventListener('vc-lang',()=>{try{if(T0!==window)T0.document.title=titleFor(qs?'about':curPage)}catch(e){}});
/* Al volver con "atras" (bfcache) la pagina se restaura tal cual: quitar la transicion del logo para no quedarse atascado */
function clearLogoGo(){document.querySelectorAll('.logo-go').forEach(n=>n.remove())}
window.addEventListener('pageshow',clearLogoGo);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)clearLogoGo()});
setView(home);
draw();
{
  /* pagina inicial segun la URL de la ventana superior (o ?p=atlas | guide | about si se abre suelto) */
  const p=new URLSearchParams(location.search).get('p');
  if(T0!==window){routeFromLocation();fichasReady.then(()=>{if(!fi){const fn=fichaFromHash();if(fn){routeQuiet=true;try{openFicha(fn,true)}finally{routeQuiet=false}}}})}
  else{routeQuiet=true;
  try{if(p==='atlas'||p==='guide')setPageActive(p);else if(p==='about')openAbout(false)}finally{routeQuiet=false}}
}
})();
</script>
<script>
/* Cielo vivo: estrellas que aparecen y desaparecen y alguna estrella fugaz */
function vcSky(cv,active){
  const ctx=cv.getContext('2d'),rm=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,stars=[],shots=[],nextShot=0,last=0;
  const R=(a,b)=>a+Math.random()*(b-a),COL=['220,229,255','255,255,255','255,233,184','190,210,255'];
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(50,Math.min(150,Math.round(W*H/9000)));
    stars=Array.from({length:n},()=>spawn(R(0,1)));
  }
  function spawn(u0){return{x:R(0,W),y:R(0,H),r:Math.random()<.15?R(1.2,1.9):R(.5,1.1),dur:R(3.5,9),u:u0,c:COL[(Math.random()*COL.length)|0],pk:R(.55,.95)}}
  function shoot(){
    const dir=Math.random()<.5?1:-1,a=R(.3,.7);
    shots.push({x:dir>0?R(.05,.65)*W:R(.35,.95)*W,y:R(0,.35)*H,vx:dir*Math.cos(a)*R(650,950),vy:Math.sin(a)*R(650,950),life:0,dur:R(.7,1.1),len:R(110,190)});
  }
  /* Easter egg: un Sputnik cruza el cielo muy de vez en cuando, mucho mas lento que una fugaz */
  let sat=null,nextSat=0;
  function spawnSat(){const dir=Math.random()<.5?1:-1;sat={x:dir>0?-30:W+30,y:R(.1,.34)*H,vx:dir*R(32,42),vy:R(-3,3),dir,t:0}}
  function satStep(dt){
    if(!sat){nextSat-=dt;if(nextSat<=0){spawnSat();nextSat=R(90,220)}return}
    sat.t+=dt;sat.x+=sat.vx*dt;sat.y+=sat.vy*dt;
    if(sat.x<-40||sat.x>W+40){sat=null;return}
    const al=Math.max(0,Math.min(1,(Math.min(sat.x,W-sat.x)+10)/120))*(.82+.18*Math.sin(sat.t*2.2)),d=-sat.dir;
    ctx.save();ctx.translate(sat.x,sat.y);
    ctx.strokeStyle='rgba(235,240,255,'+(al*.85).toFixed(3)+')';ctx.lineWidth=1;ctx.lineCap='round';
    for(const a of [-.34,-.12,.12,.34]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(d*16*Math.cos(a),16*Math.sin(a));ctx.stroke()}
    ctx.fillStyle='rgba(190,210,255,'+(al*.2).toFixed(3)+')';ctx.beginPath();ctx.arc(0,0,7,0,6.2832);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,'+al.toFixed(3)+')';ctx.beginPath();ctx.arc(0,0,2.6,0,6.2832);ctx.fill();
    ctx.restore();
  }
  function frame(t){
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(t-last)/1000||0);last=t;
    if(document.hidden||!active()){ctx.clearRect(0,0,W,H);return}
    if(!W||W!==cv.clientWidth||H!==cv.clientHeight)size();
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.u+=dt/s.dur;if(s.u>=1)Object.assign(s,spawn(0));
      const a=Math.pow(Math.sin(Math.PI*s.u),1.6)*s.pk;
      ctx.fillStyle='rgba('+s.c+','+a.toFixed(3)+')';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.2832);ctx.fill();
      if(s.r>1.2){ctx.fillStyle='rgba('+s.c+','+(a*.18).toFixed(3)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*3.2,0,6.2832);ctx.fill()}
    }
    if(!rm){satStep(dt);
      nextShot-=dt;if(nextShot<=0){shoot();nextShot=R(6,14)}
      for(let i=shots.length-1;i>=0;i--){
        const q=shots[i];q.life+=dt;const u=q.life/q.dur;if(u>=1){shots.splice(i,1);continue}
        q.x+=q.vx*dt;q.y+=q.vy*dt;
        const sp=Math.hypot(q.vx,q.vy),tx=q.x-q.vx/sp*q.len,ty=q.y-q.vy/sp*q.len,al=Math.sin(Math.PI*u);
        const g=ctx.createLinearGradient(tx,ty,q.x,q.y);g.addColorStop(0,'rgba(200,215,255,0)');g.addColorStop(1,'rgba(255,255,255,'+(al*.95).toFixed(3)+')');
        ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(q.x,q.y);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,'+(al*.9).toFixed(3)+')';ctx.beginPath();ctx.arc(q.x,q.y,1.8,0,6.2832);ctx.fill();
        ctx.fillStyle='rgba(180,200,255,'+(al*.25).toFixed(3)+')';ctx.beginPath();ctx.arc(q.x,q.y,5,0,6.2832);ctx.fill();
      }
    }
  }
  nextShot=R(2.5,5);nextSat=R(35,80);cv.vcSat=spawnSat;
  addEventListener('resize',size);
  requestAnimationFrame(frame);
}
vcSky(document.getElementById("sky"),()=>document.body.classList.contains("principal-page"));
</script>
